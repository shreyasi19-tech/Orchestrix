services:
  orchestrix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrix-platform
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DISABLE_HMR: "true"
    volumes:
      - orchestrix_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orchestrix_data:
